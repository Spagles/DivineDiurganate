<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .main {
      width: 600px;
      height: 350px;
      background-color: #b66666;
    }
    .title{
      width: 100%;
      height: 50px;
      background-color: #774a4a;
      text-align: center;
      line-height: 50px;
    }
    .chooseDiv {
      width: 100%;
      height: 300px;
      background-color: #b41f1f;
      display: flex;
    }
    .item {
      height: 270px;
      margin: 10px;
      width: 30%;
      background-color: #8f5050;
    }
    .icon {
      height: 50px;
      width: 50px;
      background-color: #807575;
      text-align: center;
      line-height: 50px;
      margin: 10px auto;
    }
    .itemClass {
      height: 30px;
      width: 100%;
      background-color: #807575;
      text-align: center;
      line-height: 30px;
      margin: 10px auto;
    }
    .desc {
      height: 80px;
      width: 100%;
      background-color: #807575;
      text-align: center;
      line-height: 80px;
      margin: 10px auto;
    }
    .chooseButton {
      height: 40px;
      width: 80%;
      background-color: #807575;
      text-align: center;
      line-height: 40px;
      margin: 25px auto;
    }
  </style>
</head>
<body>
  <div class="main">

      </div>

        <div class="itemClass">buff类型</div>
        <div class="desc">描述</div>
        <div class="chooseButton">选择</div>
      </div>
    </div>
  </div>
</body>
</html>
